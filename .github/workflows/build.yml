name: Unsigned IPA

on:
  push:
    branches: [ article-backport-11.15 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Available Xcode apps:"
          ls -d /Applications/Xcode*.app || true
          pick_xcode() {
            local app sdk
            # Prefer a 16.x toolchain with a real iPhoneOS SDK; Xcode 16.2 on
            # macos-15 is present but missing the iOS 18.2 platform.
            for app in \
              /Applications/Xcode_16.4.app \
              /Applications/Xcode_16.3.app \
              /Applications/Xcode_26.1.1.app \
              /Applications/Xcode_26.0.1.app \
              /Applications/Xcode_26.0.app \
              /Applications/Xcode.app
            do
              [ -d "$app" ] || continue
              sdk=$(ls -d "$app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS"*.sdk 2>/dev/null | head -1 || true)
              if [ -n "${sdk:-}" ] && [ -f "${sdk}/SDKSettings.plist" ]; then
                echo "Using $app"
                echo "SDK $sdk"
                sudo xcode-select -s "$app/Contents/Developer"
                return 0
              fi
              echo "Skipping $app (no usable iPhoneOS SDK)"
            done
            return 1
          }
          pick_xcode
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          df -h

      - name: Restore Bazel disk cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: .bazel-disk-cache
          key: bazel-disk-${{ runner.os }}-xcode-16.4-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'WORKSPACE') }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-xcode-16.4-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'WORKSPACE') }}-

      - name: Prefetch Bazel archives
        run: |
          set -euo pipefail
          # Bazel dies on a single GitHub 500 while fetching MODULE deps
          # (Build #8: protobuf-29.0.zip). curl retries 500s; --distdir then
          # lets Bazel use the local file instead of hitting GitHub again.
          DISTDIR="$GITHUB_WORKSPACE/build-input/bazel-distdir"
          mkdir -p "$DISTDIR"
          mkdir -p "$GITHUB_WORKSPACE/.bazel-disk-cache"

          prefetch() {
            local dest="$DISTDIR/$1"
            local sha="$2"
            shift 2
            if [ -f "$dest" ]; then
              if [ -n "$sha" ]; then
                echo "$sha  $dest" | shasum -a 256 -c -
              fi
              echo "have $(basename "$dest")"
              return 0
            fi
            local url tmp
            tmp="$dest.tmp"
            for url in "$@"; do
              echo "GET $url"
              rm -f "$tmp"
              if curl --retry 12 --retry-all-errors --retry-delay 3 --retry-max-time 180 \
                   --connect-timeout 20 --fail --location --show-error \
                   --output "$tmp" "$url"; then
                if [ -n "$sha" ]; then
                  echo "$sha  $tmp" | shasum -a 256 -c -
                fi
                mv "$tmp" "$dest"
                ls -lh "$dest"
                return 0
              fi
              rm -f "$tmp"
            done
            echo "WARN: could not prefetch $(basename "$dest"); Bazel will retry during the build"
            return 0
          }

          prefetch protobuf-29.0.zip \
            2e442d21839ec9dbafda4cc9083239aa04e78fc9c27dfa59b5374e968050cd22 \
            https://mirror.bazel.build/github.com/protocolbuffers/protobuf/releases/download/v29.0/protobuf-29.0.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.0/protobuf-29.0.zip

          prefetch rules_shell-v0.2.0.tar.gz \
            410e8ff32e018b9efd2743507e7595c26e2628567c42224411ff533b57d27c28 \
            https://mirror.bazel.build/github.com/bazelbuild/rules_shell/releases/download/v0.2.0/rules_shell-v0.2.0.tar.gz \
            https://github.com/bazelbuild/rules_shell/releases/download/v0.2.0/rules_shell-v0.2.0.tar.gz

          prefetch rules_python-1.3.0.tar.gz \
            2cc26bbd53854ceb76dd42a834b1002cd4ba7f8df35440cf03482e045affc244 \
            https://mirror.bazel.build/github.com/bazel-contrib/rules_python/releases/download/1.3.0/rules_python-1.3.0.tar.gz \
            https://github.com/bazel-contrib/rules_python/releases/download/1.3.0/rules_python-1.3.0.tar.gz

          prefetch cmake-3.23.1-macos-universal.tar.gz \
            f794ed92ccb4e9b6619a77328f313497d7decf8fb7e047ba35a348b838e0e1e2 \
            https://github.com/Kitware/CMake/releases/download/v3.23.1/cmake-3.23.1-macos-universal.tar.gz

          prefetch meson-1.6.0.tar.gz \
            999b65f21c03541cf11365489c1fad22e2418bb0c3d50ca61139f2eec09d5496 \
            https://github.com/mesonbuild/meson/releases/download/1.6.0/meson-1.6.0.tar.gz

          prefetch ninja-mac.zip \
            89a287444b5b3e98f88a945afa50ce937b8ffd1dcc59c555ad9b1baf855298c9 \
            https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-mac.zip

          prefetch v24.12.23.zip \
            c5cd6a605ff20350c7faa19d8eeb599df6117ea4aabd16ac58a7eb5ba82df4e7 \
            https://github.com/google/flatbuffers/archive/refs/tags/v24.12.23.zip

          # --distdir is a client/common option, not a startup option. Bazel
          # automatically reads .bazelrc; a sibling user.bazelrc is ignored.
          printf 'common --distdir=%s\ncommon --disk_cache=%s\ncommon --http_connector_attempts=12\nbuild --keep_going\n' "$DISTDIR" "$GITHUB_WORKSPACE/.bazel-disk-cache" \
            >> "$GITHUB_WORKSPACE/.bazelrc"
          echo "appended CI options to .bazelrc:"
          tail -n 4 "$GITHUB_WORKSPACE/.bazelrc"

      - name: Build unsigned app
        run: |
          set -euo pipefail
          SOURCE_DIR="$GITHUB_WORKSPACE"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          export SOURCE_SHA=$(git rev-parse HEAD)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "LAYER=228" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          # Do not pass --disableProvisioningProfiles: rules_apple then sets
          # provisioning_profile=None and fails device IPA analysis (Build #7).
          mkdir -p build/logs
          attempt=1
          max_attempts=4
          while true; do
            log="build/logs/make-attempt-${attempt}.log"
            echo "Make.py attempt ${attempt}/${max_attempts}"
            start=$(date +%s)
            set +e
            python3 -u build-system/Make/Make.py \
              --overrideXcodeVersion \
              build \
              --configurationPath="build-system/appstore-configuration.json" \
              --codesigningInformationPath=build-system/fake-codesigning \
              --configuration=release_arm64 \
              --buildNumber="$BUILD_NUMBER" \
              --outputBuildArtifactsPath="build/artifacts" \
              2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            elapsed=$(( $(date +%s) - start ))
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ] || [ "$elapsed" -ge 180 ]; then
              echo "Make.py failed after ${elapsed}s (attempt ${attempt}); not retrying"
              exit "$status"
            fi
            if ! grep -Eqi 'Error downloading|GET returned 50[0-9]|502 Bad Gateway|503 Service|connection reset|Unknown host|timed out' "$log"; then
              echo "Make.py failed after ${elapsed}s with a non-fetch error; not retrying"
              exit "$status"
            fi
            echo "Make.py hit a fetch flake after ${elapsed}s; retry ${attempt}/${max_attempts}"
            attempt=$((attempt + 1))
            sleep $((attempt * 15))
          done

          test -f build/artifacts/Telegram.ipa
          cp build/artifacts/Telegram.ipa build/artifacts/Telegram-11.15-articles-unsigned.ipa
          python3 -c 'import json,os,datetime; open("build/artifacts/build-metadata.json","w").write(json.dumps({"source_sha":os.environ.get("SOURCE_SHA"),"app_version":os.environ.get("APP_VERSION"),"build_number":os.environ.get("BUILD_NUMBER"),"api_layer":"228","built_at":datetime.datetime.utcnow().isoformat()+"Z","signing":"unsigned / fake-codesigning"}, indent=2)+"\n")'
          ls -lh build/artifacts
          df -h

      - name: Save Bazel disk cache
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .bazel-disk-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-11.15-articles-unsigned
          path: |
            build/artifacts/Telegram-11.15-articles-unsigned.ipa
            build/artifacts/build-metadata.json
          if-no-files-found: error
