name: Unsigned IPA

on:
  push:
    branches: [ article-backport-11.15 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Available Xcode apps:"
          ls -d /Applications/Xcode*.app || true
          pick_xcode() {
            local app sdk
            # Prefer a 16.x toolchain with a real iPhoneOS SDK; Xcode 16.2 on
            # macos-15 is present but missing the iOS 18.2 platform.
            for app in \
              /Applications/Xcode_16.4.app \
              /Applications/Xcode_16.3.app \
              /Applications/Xcode_26.1.1.app \
              /Applications/Xcode_26.0.1.app \
              /Applications/Xcode_26.0.app \
              /Applications/Xcode.app
            do
              [ -d "$app" ] || continue
              sdk=$(ls -d "$app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS"*.sdk 2>/dev/null | head -1 || true)
              if [ -n "${sdk:-}" ] && [ -f "${sdk}/SDKSettings.plist" ]; then
                echo "Using $app"
                echo "SDK $sdk"
                sudo xcode-select -s "$app/Contents/Developer"
                return 0
              fi
              echo "Skipping $app (no usable iPhoneOS SDK)"
            done
            return 1
          }
          pick_xcode
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          df -h

      - name: Build unsigned app
        run: |
          set -euo pipefail
          SOURCE_DIR="$GITHUB_WORKSPACE"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "LAYER=228" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="build/artifacts"

          test -f build/artifacts/Telegram.ipa
          cp build/artifacts/Telegram.ipa build/artifacts/Telegram-11.15-articles-unsigned.ipa
          python3 -c 'import json,os,datetime; open("build/artifacts/build-metadata.json","w").write(json.dumps({"source_sha":os.environ.get("SOURCE_SHA"),"app_version":os.environ.get("APP_VERSION"),"build_number":os.environ.get("BUILD_NUMBER"),"api_layer":"228","built_at":datetime.datetime.utcnow().isoformat()+"Z","signing":"unsigned / fake-codesigning"}, indent=2)+"\n")'
          ls -lh build/artifacts
          df -h

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-11.15-articles-unsigned
          path: |
            build/artifacts/Telegram-11.15-articles-unsigned.ipa
            build/artifacts/build-metadata.json
          if-no-files-found: error
